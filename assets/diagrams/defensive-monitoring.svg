<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Verify and protect gateway mappings</title><desc id="desc">Trusted bindings inform a managed switch check and host monitoring of the gateway MAC.</desc>
