mily="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Trusted binding</text><path d="M600 515 H1000" stroke="#00E676" stroke-width="4"  marker-end="url(#arr-green)"/><text x="800" y="503" fill="#00E676" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Validated ARP</text><text x="60" y="602" fill="#FFD070" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Corroborate alerts with packet captures, route checks, and reachability.</text>
