<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Gateway cache: before and after</title><desc id="desc">Two side-by-side cache cards show a legitimate gateway MAC and an incorrect laboratory host MAC.</desc>
<defs><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#00D9FF"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#00E676"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#FF5E78"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#FFD070"/></marker></defs>
<rect width="1200" height="730" rx="24" fill="#040607"/><rect x="24" y="24" width="1152" height="648" rx="10" fill="#080D10" stroke="#25363D" stroke-width="2"/>
<text x="60" y="79" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="start">Gateway cache: before and after</text><text x="60" y="115" fill="#C7DAE1" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start">A changed local mapping redirects frames; it does not itself prove a relay.</text>
<rect x="70" y="160" width="500" height="186" rx="8" fill="#10191E" stroke="#00E676" stroke-width="2"/><rect x="70" y="160" width="500" height="9" rx="4" fill="#00E676"/><text x="92" y="205" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Before: trusted</text><text x="92" y="246" fill="#D7E8ED" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Gateway IP 192.0.2.1</text><text x="92" y="275" fill="#D7E8ED" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">maps to MAC ...:01</text><text x="92" y="304" fill="#D7E8ED" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">genuine gateway interface</text><rect x="630" y="160" width="500" height="186" rx="8" fill="#10191E" stroke="#FF5E78" stroke-width="2"/><rect x="630" y="160" width="500" height="9" rx="4" fill="#FF5E78"/><text x="652" y="205" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">After: incorrect</text><text x="652" y="246" fill="#D7E8ED" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Gateway IP 192.0.2.1</text><text x="652" y="275" fill="#D7E8ED" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">maps to MAC ...:15</text><text x="652" y="304" fill="#D7E8ED" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">laboratory host interface</text><path d="M120 454 H520" stroke="#00E676" stroke-width="4"  marker-end="url(#arr-green)"/><text x="320" y="442" fill="#00E676" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Victim → genuine gateway</text><path d="M680 454 H1080" stroke="#FF5E78" stroke-width="4"  marker-end="url(#arr-red)"/><text x="880" y="442" fill="#FF5E78" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Victim → laboratory host</text><text x="90" y="552" fill="#EAF2F5" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">Same logical destination. Different Ethernet next hop.</text>
<path d="M44 652 H1156" stroke="#25363D" stroke-width="1"/><rect x="44" y="656" width="1112" height="55" rx="5" fill="#040607"/><circle cx="70" cy="686" r="7" fill="#00D9FF"/><text x="86" y="692" fill="#EAF2F5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Data path</text><circle cx="268" cy="686" r="7" fill="#00E676"/><text x="284" y="692" fill="#EAF2F5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Valid mapping / ARP</text><circle cx="590" cy="686" r="7" fill="#FF5E78"/><text x="606" y="692" fill="#EAF2F5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Misleading claim</text><circle cx="885" cy="686" r="7" fill="#FFD070"/><text x="901" y="692" fill="#EAF2F5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Possible disruption</text>
</svg>