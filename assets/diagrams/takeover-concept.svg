<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Incorrect mapping: possible disruption</title><desc id="desc">Victim sends gateway-bound frames to the laboratory MAC. A missing relay can interrupt the victim although the router remains available.</desc>
<defs><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#00D9FF"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#00E676"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#FF5E78"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#FFD070"/></marker></defs>
<rect width="1200" height="730" rx="24" fill="#040607"/><rect x="24" y="24" width="1152" height="648" rx="10" fill="#080D10" stroke="#25363D" stroke-width="2"/>
<text x="60" y="79" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="start">Incorrect mapping: possible disruption</text><text x="60" y="115" fill="#C7DAE1" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start">The victim can lose its route while the actual router remains healthy.</text>
<rect x="55" y="160" width="290" height="186" rx="8" fill="#10191E" stroke="#FF5E78" stroke-width="2"/><rect x="55" y="160" width="290" height="9" rx="4" fill="#FF5E78"/><text x="77" y="205" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Windows 11 victim</text><text x="77" y="246" fill="#D7E8ED" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Gateway IP 192.0.2.1</text><text x="77" y="275" fill="#D7E8ED" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">cached MAC ...:15</text><rect x="455" y="160" width="290" height="186" rx="8" fill="#10191E" stroke="#FFD070" stroke-width="2"/><rect x="455" y="160" width="290" height="9" rx="4" fill="#FFD070"/><text x="477" y="205" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Lab VM</text><text x="477" y="246" fill="#D7E8ED" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Receives misdirected frames</text><text x="477" y="275" fill="#D7E8ED" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Relay is not assured</text><rect x="855" y="160" width="290" height="186" rx="8" fill="#10191E" stroke="#00E676" stroke-width="2"/><rect x="855" y="160" width="290" height="9" rx="4" fill="#00E676"/><text x="877" y="205" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Actual gateway</text><text x="877" y="246" fill="#D7E8ED" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">IP 192.0.2.1</text><text x="877" y="275" fill="#D7E8ED" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">real MAC ...:01</text><path d="M600 420 H200" stroke="#FF5E78" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arr-red)"/><text x="400" y="408" fill="#FF5E78" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Incorrect gateway claim</text><path d="M200 492 H600" stroke="#00D9FF" stroke-width="4"  marker-end="url(#arr-cyan)"/><text x="400" y="480" fill="#00D9FF" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Gateway-bound frame</text><path d="M600 564 H1000" stroke="#FFD070" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arr-amber)"/><text x="800" y="552" fill="#FFD070" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Delivery may stop here</text><text x="60" y="620" fill="#EAF2F5" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Check the gateway independently before attributing a loss to the cache.</text>
<path d="M44 652 H1156" stroke="#25363D" stroke-width="1"/><rect x="44" y="656" width="1112" height="55" rx="5" fill="#040607"/><circle cx="70" cy="686" r="7" fill="#00D9FF"/><text x="86" y="692" fill="#EAF2F5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Data path</text><circle cx="268" cy="686" r="7" fill="#00E676"/><text x="284" y="692" fill="#EAF2F5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Valid mapping / ARP</text><circle cx="590" cy="686" r="7" fill="#FF5E78"/><text x="606" y="692" fill="#EAF2F5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Misleading claim</text><circle cx="885" cy="686" r="7" fill="#FFD070"/><text x="901" y="692" fill="#EAF2F5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Possible disruption</text>
</svg>